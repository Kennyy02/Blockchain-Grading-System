services:
  - type: web
    name: grading-management-system
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      # Database connection - Free MySQL Provider
      # Option 1: Aiven (Recommended - Free tier available)
      # Option 2: db4free.net (Simple free MySQL)
      # Add these in Render dashboard:
      # DB_CONNECTION=mysql
      # DB_HOST=your-mysql-host
      # DB_PORT=3306
      # DB_DATABASE=your-database-name
      # DB_USERNAME=your-username
      # DB_PASSWORD=your-password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
